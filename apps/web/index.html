<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALPHA PERFORMANCE OS — Enterprise Management & Operations Portal</title>
  
  <!-- Typography: Plus Jakarta Sans (UI) + Outfit (Metrics/Display) + JetBrains Mono (Telemetry) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body, #root {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background-color: #07090E;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* Loading Skeleton */
    .app-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      gap: 16px;
      background: radial-gradient(circle at 50% 30%, rgba(0, 240, 255, 0.05) 0%, #07090E 70%);
    }
    .app-loader-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 240, 255, 0.15);
      border-top-color: #00F0FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .app-loader-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #94A3B8;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="app-loader">
      <div class="app-loader-spinner"></div>
      <div class="app-loader-text">Loading ALPHA Enterprise Operations Portal...</div>
    </div>
  </div>
  <script src="/bundle.js?v=2.1.0"></script>
</body>
</html>
